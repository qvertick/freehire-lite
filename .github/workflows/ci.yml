name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.diagram-design'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.diagram-design'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# Явные права вместо умолчаний репозитория: содержимое читать можно,
# список изменённых файлов в PR — тоже (paths-filter ходит в API за списком
# файлов, и без этого права он падает с "Resource not accessible by integration").
permissions:
  contents: read
  pull-requests: read

jobs:
  # 1. Разведчик: проверяет, какие папки изменились
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      extension: ${{ steps.filter.outputs.extension }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: paths-filter для push-событий сравнивает HEAD с HEAD~,
          # а при shallow clone предыдущего коммита просто нет.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'services/**'
              - 'harvest/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - 'DockerCompose*.yml'
            frontend:
              - 'web/**'
            extension:
              - 'extension/**'

  # 2. Бэкенд (Go + Postgres pgvector + Meilisearch + Redis + компиляция бинарников)
  backend-go:
    name: Go Build, Migrations & Tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (poppler-utils)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Start backing services & apply migrations
        run: |
          cp -n .env.example .env || true
          # Три сервиса с healthcheck'ами: --wait дожидается, пока каждый станет healthy.
          docker compose -f DockerCompose.windows.yml up -d --wait db redis meilisearch
          # meili-init — одноразовый контейнер (PATCH /experimental-features), он
          # сразу завершается. `docker compose up meili-init` без -d ждал бы
          # завершения ВСЕХ сервисов, а meilisearch не останавливается никогда —
          # шаг бы висел до таймаута. `run --rm` выполняет его как одноразовый.
          docker compose -f DockerCompose.windows.yml run --rm meili-init

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build server & utilities
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o bin/hire ./cmd/server
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o bin/ \
            ./cmd/ingest ./cmd/enrich ./cmd/reindex ./cmd/tg-ingest ./cmd/tg-extract \
            ./cmd/backfill-derive ./cmd/liveness ./cmd/import-collections \
            ./cmd/recount-companies ./cmd/migrate

      - name: Run Go vet & tests
        env:
          DATABASE_URL: "postgres://hire:hire@localhost:5432/hire?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          MEILI_URL: "http://localhost:7700"
          MEILI_MASTER_KEY: "dev-insecure-meili-key"
        run: |
          go vet ./...
          # integration-теги компилируются, но не запускаются: без них два guard'а
          # (depguard и проверка слоёв) молча выключаются (см. AGENTS.md).
          go vet -tags=integration ./...
          go test ./...

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: freehire-binaries-linux
          path: bin/
          retention-days: 7

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f DockerCompose.windows.yml logs

      - name: Stop containers
        if: always()
        run: docker compose -f DockerCompose.windows.yml down -v

    # 3. Фронтенд (SvelteKit в web/)
  frontend-web:
    name: Web Build & Check
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm, а не npm: в репозитории лежит pnpm-lock.yaml, packageManager —
      # pnpm@11.7.0. `npm ci` без package-lock.json падает, а setup-node с
      # cache: npm и cache-dependency-path: web/package-lock.json падает ещё
      # раньше — файл не существует.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            web/pnpm-lock.yaml
            design-system/pnpm-lock.yaml

      # design-system ставится первым: web/depends on it через link:, и pnpm
      # не ставит зависимости связанного пакета сам.
      - name: Install design-system
        run: pnpm --dir design-system install --frozen-lockfile

      - name: Install web
        run: pnpm --dir web install --frozen-lockfile

      - name: Build web
        run: pnpm --dir web run build

    # 4. Браузерное расширение (WXT в extension/)
  browser-extension:
    name: Extension Build & Check
    needs: changes
    if: ${{ needs.changes.outputs.extension == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm нужен только ради design-system (design-system/ управляется pnpm).
      # Само расширение — единственный JS-пакет в репозитории на npm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      # extension/ тянет design-system через file:, а npm не ставит зависимости
      # связанного пакета — без этой строки сборка падает на резолве.
      - name: Install design-system
        run: pnpm --dir design-system install --frozen-lockfile

      - name: Install extension
        run: npm --prefix extension ci

      - name: Build extension
        run: npm --prefix extension run build
