name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # ЗАДАЧА 1: Проверка Фронтенда (SvelteKit в папке web/)
  # =========================================================================
  frontend-web:
    name: Web Build & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

  # =========================================================================
  # ЗАДАЧА 2: Проверка Бэкенда (Go + Postgres pgvector + Meilisearch + Redis)
  # =========================================================================
  backend-go:
    name: Go Build, Migrations & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Поднимаем инфраструктуру из твоего DockerCompose.windows.yml
      # Флаг --wait заставит GitHub дождаться, пока db, meilisearch, redis и meili-init пройдут healthcheck!
      - name: Start backing services & apply migrations
        run: |
          docker compose -f DockerCompose.windows.yml up -d --wait

      # 2. Устанавливаем Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # 3. Компилируем бинарники (собираем артефакт, как ты и хотел!)
      - name: Build server & workers
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -o bin/server ./cmd/server
          CGO_ENABLED=0 go build -o bin/search-drain ./cmd/search-drain

      # 4. Прогоняем тесты на живой базе данных, Redis и Meilisearch
      - name: Run Go tests
        env:
          DATABASE_URL: "postgres://hire:hire@localhost:5432/hire?sslmode=disable"
          REDIS_URL: "redis://localhost:6379"
          MEILI_URL: "http://localhost:7700"
          MEILI_MASTER_KEY: "dev-insecure-meili-key"
        run: |
          go vet ./...
          go test -v ./...

      # 5. Сохраняем собранные бинарники как артефакт (чтобы убедиться, что артефакт валиден)
      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: freehire-binaries-linux
          path: bin/
          retention-days: 7

      # 6. Прибираем за собой (и если что-то упало — выводим логи контейнеров)
      - name: Dump logs on failure & stop containers
        if: always()
        run: |
          if [ "${{ job.status }}" == "failure" ]; then
            docker compose -f DockerCompose.windows.yml logs
          fi
          docker compose -f DockerCompose.windows.yml down -v